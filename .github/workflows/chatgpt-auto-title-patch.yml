name: One-shot auto-title repair

on:
  push:
    branches:
      - chatgpt/fix-auto-chat-titles

permissions:
  contents: write

jobs:
  patch-auto-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-auto-chat-titles

      - name: Apply auto-title repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt")
          text = path.read_text(encoding="utf-8")

          old_prompt = (
              '                val m = ArrayList(msgs.filter { it.role != ChatRole.System })\n'
              '\n'
              '                m.add(\n'
              '                    ChatMessage(\n'
              '                        role = ChatRole.User,\n'
              '                        content = "Create a short name for this chat according to the messages provided. Enter just short name and nothing else. Don\'t add word \'chat\' or \'bot\' to the name."\n'
              '                    )\n'
              '                )\n'
          )
          new_prompt = (
              '                // Preserve the normal leading System prefix byte-for-byte so providers\n'
              '                // can reuse any prompt cache already built for the conversation. The\n'
              '                // title-only instruction belongs at the boundary immediately before\n'
              '                // the first conversation turn. Appending it as a User message caused\n'
              '                // some models to title the naming instruction itself instead.\n'
              '                val m = ArrayList(msgs)\n'
              '                val conversationStart = m.indexOfFirst { it.role != ChatRole.System }\n'
              '                    .let { if (it >= 0) it else m.size }\n'
              '\n'
              '                m.add(\n'
              '                    conversationStart,\n'
              '                    ChatMessage(\n'
              '                        role = ChatRole.System,\n'
              '                        content = "Create a concise 2-6 word title for the conversation that follows. " +\n'
              '                                "Return only the title text. Describe the conversation topic, not this naming instruction. " +\n'
              '                                "Do not explain or describe what the user wants. Do not prefix the title with " +\n'
              '                                "\'Title\', \'Name\', \'Chat\', or \'Bot\'."\n'
              '                    )\n'
              '                )\n'
          )
          if text.count(old_prompt) != 1:
              raise SystemExit(f"expected exactly one old auto-title prompt block, found {text.count(old_prompt)}")
          text = text.replace(old_prompt, new_prompt, 1)

          old_request = (
              '                val chatCompletionRequest2 = ChatCompletionRequest(\n'
              '                    model = ModelId(titleModel),\n'
              '                    maxTokens = 10,\n'
              '                    messages = m\n'
              '                )\n'
          )
          new_request = (
              '                val chatCompletionRequest2 = ChatCompletionRequest(\n'
              '                    model = ModelId(titleModel),\n'
              '                    // Ten tokens was too small for a heterogeneous set of models:\n'
              '                    // some spend part of the completion budget before emitting title\n'
              '                    // text. The prompt still constrains the visible answer to 2-6 words.\n'
              '                    maxTokens = 128,\n'
              '                    messages = m\n'
              '                )\n'
          )
          if text.count(old_request) != 1:
              raise SystemExit(f"expected exactly one old auto-title request block, found {text.count(old_request)}")
          text = text.replace(old_request, new_request, 1)

          old_response = (
              '                val newChatName: String? = try {\n'
              '                    ai!!.chatCompletion(chatCompletionRequest2).choices.firstOrNull()?.message?.content?.trim()\n'
              '                } catch (e: Exception) {\n'
              '                    logVoiceEvent("auto-name request failed (attempt $autoNameAttempts of $AUTO_NAME_MAX_ATTEMPTS); a later turn retries")\n'
              '                    null\n'
              '                }\n'
          )
          new_response = (
              '                val newChatName: String? = try {\n'
              '                    val rawName = ai!!.chatCompletion(chatCompletionRequest2)\n'
              '                        .choices.firstOrNull()?.message?.content\n'
              '                    rawName\n'
              '                        ?.trim()\n'
              '                        ?.lineSequence()\n'
              '                        ?.firstOrNull { it.isNotBlank() }\n'
              '                        ?.trim()\n'
              '                        ?.replace(Regex("(?i)^(title|name)\\\\s*:\\\\s*"), "")\n'
              '                        ?.trim()\n'
              '                        ?.removeSurrounding("\\\"")\n'
              '                        ?.removeSurrounding("\'")\n'
              '                        ?.removeSurrounding("`")\n'
              '                        ?.removeSurrounding("**")\n'
              '                        ?.trim()\n'
              '                        ?.take(80)\n'
              '                        ?.trim()\n'
              '                        ?.takeIf { it.isNotBlank() }\n'
              '                } catch (e: Exception) {\n'
              '                    logVoiceEvent("auto-name request failed (attempt $autoNameAttempts of $AUTO_NAME_MAX_ATTEMPTS); a later turn retries")\n'
              '                    null\n'
              '                }\n'
          )
          if text.count(old_response) != 1:
              raise SystemExit(f"expected exactly one old auto-title response block, found {text.count(old_response)}")
          text = text.replace(old_response, new_response, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify patch
        shell: bash
        run: git diff --check

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/chatgpt-auto-title-patch.yml
          git add -- app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt
          git commit -m "Fix chat auto-title requests"
          git push origin HEAD:chatgpt/fix-auto-chat-titles
