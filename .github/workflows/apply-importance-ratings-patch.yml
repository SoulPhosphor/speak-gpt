name: Apply importance ratings patch

on:
  push:
    branches:
      - fix/importance-ratings-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/importance-ratings-ui
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/run_importance_ratings_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: complete importance ratings controls"
          git push origin HEAD:fix/importance-ratings-ui
