name: Apply signed importance patch

on:
  push:
    branches:
      - feature/signed-importance-ratings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/signed-importance-ratings
      - name: Align patch script with current resource labels
        shell: bash
        run: |
          sed -i 's/>1<\/string>/>1 Low importance<\/string>/' .github/scripts/apply_signed_importance_patch.py
          sed -i 's/>2<\/string>/>2 Minor<\/string>/' .github/scripts/apply_signed_importance_patch.py
          sed -i 's/>3<\/string>/>3 Notable<\/string>/' .github/scripts/apply_signed_importance_patch.py
          sed -i 's/>4<\/string>/>4 High<\/string>/' .github/scripts/apply_signed_importance_patch.py
          sed -i 's/>5<\/string>/>5 Critical<\/string>/' .github/scripts/apply_signed_importance_patch.py
          sed -i 's/mem_importance_dialog_title/mem_edit_label_importance/g' .github/scripts/apply_signed_importance_patch.py
      - name: Apply targeted patch
        run: python3 .github/scripts/apply_signed_importance_patch.py
      - name: Commit implementation and remove patch scaffolding
        shell: bash
        run: |
          rm .github/scripts/apply_signed_importance_patch.py
          rm .github/workflows/apply-signed-importance-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement signed importance ratings"
          git push origin HEAD:feature/signed-importance-ratings
