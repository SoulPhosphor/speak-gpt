name: Inspect Stage 2 test proof
on:
  push:
    branches:
      - diagnostics/parallel-stage2-recovery-proof
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jvm-test-results
          repository: SoulPhosphor/speak-gpt
          run-id: 44950607150
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence
      - name: Read existing unit-test reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          variants = {}
          for path in Path("evidence").rglob("TEST-*.xml"):
              root = ET.parse(path).getroot()
              totals = variants.setdefault(path.parent.name, dict(tests=0, failures=0, errors=0, skipped=0))
              for key in totals:
                  totals[key] += int(root.get(key, "0"))
          if not variants:
              raise SystemExit("No JVM result XML was found")
          print("Final source commit: 6fde4c50f0b74de3eba3d12e7b27319b60e82782")
          print(json.dumps(variants, sort_keys=True))
          assert all(v["failures"] == 0 and v["errors"] == 0 for v in variants.values())
          PY
