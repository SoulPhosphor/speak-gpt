name: Android Checks

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK r26d + CMake 3.22
        run: |
          set -e
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        # The three app variants have a large Android/PDF/OCR classpath. Keep
        # their Kotlin compilation and JVM test workers inside runner memory.
        run: ./gradlew --no-daemon --max-workers=1 test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build and verify side-by-side Beta identity
        run: |
          ./gradlew --no-daemon assembleBeta
          APK=app/build/outputs/apk/beta/app-beta.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.soulphosphor.phosphorshines.beta"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'Phosphor Shines Beta'"

      - name: Compile instrumentation tests
        # Compiles app/src/androidTest (the SQLCipher MemoryStore migration and
        # deletion suite) so build breakage in the tests is caught in CI. The
        # tests themselves require an arm64 device/emulator to RUN
        # (connectedAndroidTest), which the app's arm64-only native code makes
        # impractical on a standard x86_64 CI emulator; compiling them here still
        # guards the suite against bit-rot.
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload side-by-side Beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-beta-apk
          path: app/build/outputs/apk/beta/app-beta.apk
          if-no-files-found: error

      - name: Archive JVM test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-results
          path: app/build/test-results/test*/**/*.xml
          if-no-files-found: error

  recovery-instrumentation:
    name: Recovery instrumentation and fault matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install emulator and build dependencies
        run: |
          set -euo pipefail
          packages=(
            "platform-tools"
            "emulator"
            "system-images;android-35;google_apis;x86_64"
            "ndk;26.3.11579264"
            "cmake;3.22.1"
          )
          # A broken download (for example a truncated emulator zip) fails
          # this step before any test runs. Retry only the download, clearing
          # partial files first. Test steps below are never retried.
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if sdkmanager --install "${packages[@]}"; then
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "SDK package download failed after $attempts attempts." >&2
              exit 1
            fi
            echo "SDK package download failed (attempt $attempt of $attempts); clearing partial files and retrying." >&2
            rm -rf \
              "$ANDROID_HOME/.temp" \
              "$ANDROID_HOME/.downloadIntermediates" \
              "$ANDROID_HOME/emulator" \
              "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
            sleep $((attempt * 15))
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          chmod +x ./gradlew

      - name: Start disposable x86_64 emulator
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name recovery-matrix \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6 \
            --path "$ANDROID_AVD_HOME/recovery-matrix.avd"
          sudo chmod 666 /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" @recovery-matrix \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -camera-back none -camera-front none -wipe-data \
            > "$RUNNER_TEMP/recovery-emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -n 200 "$RUNNER_TEMP/recovery-emulator.log"
              exit 1
            fi
            if adb devices | grep -q '^emulator-' && \
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 5
          done
          tail -n 200 "$RUNNER_TEMP/recovery-emulator.log"
          exit 1

      - name: Build x86_64 recovery test APKs
        run: >-
          ./gradlew --no-daemon
          -PrecoveryInstrumentationAbi=x86_64
          assembleDebug assembleDebugAndroidTest

      - name: Install recovery test APKs
        run: |
          set -euo pipefail
          adb install -t app/build/outputs/apk/debug/app-debug.apk
          adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Prepare q4 Android validation
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/step2-model"
          mkdir -p "$model_dir"
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/5090578d9565bb06545b4552f76e6bc2c93e4a66
          curl --fail --location --retry 3 "$base/onnx/model_q4.onnx" -o "$model_dir/model.onnx"
          curl --fail --location --retry 3 "$base/onnx/model_q4.onnx_data" -o "$model_dir/model_q4.onnx_data"
          curl --fail --location --retry 3 "$base/tokenizer.json" -o "$model_dir/tokenizer.json"
          (cd "$model_dir" && sha256sum --check <<'HASHES'
          ad1dfee81a70f7944b9b9d1cc6e48075b832881cf33fab2f2b248be78f3f0043  model.onnx
          599962c3143b040de2dd05e5975be3e9091dd067cacc6a8f7186e3203bab9e02  model_q4.onnx_data
          4dda02faaf32bc91031dc8c88457ac272b00c1016cc679757d1c441b248b9c47  tokenizer.json
          HASHES
          )
          target=/sdcard/Android/data/com.soulphosphor.phosphorshines/files/step2-model
          adb shell mkdir -p "$target"
          adb push "$model_dir/model.onnx" "$target/model.onnx"
          adb push "$model_dir/model_q4.onnx_data" "$target/model_q4.onnx_data"
          adb push "$model_dir/tokenizer.json" "$target/tokenizer.json"

      - name: Run recovery instrumentation and fault suite
        env:
          STEP2_REAL_MODEL: 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-results"
          classes=(
            org.teslasoft.assistant.preferences.memory.Step2RecallInstrumentedTest
            org.teslasoft.assistant.ui.util.PromptLibrarySearchInstrumentedTest
            org.teslasoft.assistant.preferences.backup.PortableRecoveryMatrixInstrumentedTest
            org.teslasoft.assistant.preferences.backup.DirectDatabaseRestoreInstrumentedTest
            org.teslasoft.assistant.preferences.memory.MemorySharedRestoreInstrumentedTest
            org.teslasoft.assistant.preferences.backup.companion.CompanionBackupExporterImageValidationInstrumentedTest
            org.teslasoft.assistant.preferences.generatedimages.GeneratedImageCatalogRecoveryInstrumentedTest
            org.teslasoft.assistant.preferences.includes.PdfAttachmentStoreInstrumentedTest
            org.teslasoft.assistant.preferences.includes.PdfFallbackExtractorInstrumentedTest
            org.teslasoft.assistant.preferences.chatstore.ChatStoreInstrumentedTest
            org.teslasoft.assistant.preferences.chatstore.ChatStorageFoundationsInstrumentedTest
            org.teslasoft.assistant.preferences.backup.LargeChatBackupInstrumentedTest
          )
          failed=0
          for class_name in "${classes[@]}"; do
            result_name="${class_name##*.}"
            adb logcat -c
            extra_args=()
            if [ "$result_name" = "Step2RecallInstrumentedTest" ]; then
              wifi_before=$(adb shell settings get global wifi_on | tr -d '\r')
              data_before=$(adb shell settings get global mobile_data | tr -d '\r')
              adb shell svc wifi disable
              adb shell svc data disable
              if [ "$STEP2_REAL_MODEL" = true ]; then extra_args=(-e step2_real_model true); fi
            fi
            set +e
            adb shell am instrument -w -r \
              "${extra_args[@]}" -e class "$class_name" \
              com.soulphosphor.phosphorshines.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "$RUNNER_TEMP/recovery-results/$result_name.txt"
            instrument_status=${PIPESTATUS[0]}
            set -e
            if [ "$result_name" = "Step2RecallInstrumentedTest" ]; then
              if [ "$wifi_before" = 1 ]; then adb shell svc wifi enable; fi
              if [ "$data_before" = 1 ]; then adb shell svc data enable; fi
              adb shell rm -rf /sdcard/Android/data/com.soulphosphor.phosphorshines/files/step2-model
            fi
            adb logcat -d -v threadtime \
              > "$RUNNER_TEMP/recovery-results/$result_name-logcat.txt"
            if [ "$result_name" = "Step2RecallInstrumentedTest" ]; then
              adb pull /sdcard/Android/data/com.soulphosphor.phosphorshines/files/step2-match.png \
                "$RUNNER_TEMP/recovery-results/step2-match.png" || true
            fi
            if [ "$instrument_status" -ne 0 ] || \
              ! grep -Fq "OK (" "$RUNNER_TEMP/recovery-results/$result_name.txt"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Record recovery proof metadata
        if: always()
        run: |
          {
            echo "## Phase 12.9 automated recovery matrix"
            echo "- Candidate commit: $GITHUB_SHA"
            echo "- Emulator ABI: $(adb shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r')"
            echo "- Android: $(adb shell getprop ro.build.version.release 2>/dev/null | tr -d '\r')"
            echo "- JVM results: archived by the test job"
            echo "- Instrumentation output: archived by this job"
            echo "- Recovery assertions: logical content, reference closure, integrity, journal cleanup"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive instrumentation and fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-instrumentation-results
          path: |
            ${{ runner.temp }}/recovery-results
            ${{ runner.temp }}/recovery-emulator.log
          if-no-files-found: error
