name: Android Checks

# One full run per commit: pull requests into main, and main itself after a
# merge. Branch pushes without a pull request do not run the suite, so a PR
# commit is no longer checked twice (push + pull_request).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A newer commit on the same pull request cancels the older, now obsolete run.
# Runs on main (and manual runs) are never cancelled.
concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK r26d + CMake 3.22
        run: |
          set -e
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # Robolectric downloads its Android framework jars from Maven Central
      # while the unit tests run, outside the Gradle cache. Keeping them
      # avoids repeat downloads that Maven Central has rate-limited (HTTP 429).
      - name: Cache Robolectric framework jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Download pinned EmbeddingGemma tokenizer for JVM tests
        # Real-tokenizer unit tests (PassageSearchTextGemmaTest,
        # ScannerQueryWindowsGemmaTest) read it through GEMMA_TOKENIZER_JSON.
        run: |
          set -euo pipefail
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/5090578d9565bb06545b4552f76e6bc2c93e4a66
          curl --fail --location --retry 3 "$base/tokenizer.json" -o "$RUNNER_TEMP/tokenizer.json"
          echo "4dda02faaf32bc91031dc8c88457ac272b00c1016cc679757d1c441b248b9c47  $RUNNER_TEMP/tokenizer.json" | sha256sum --check
          echo "GEMMA_TOKENIZER_JSON=$RUNNER_TEMP/tokenizer.json" >> "$GITHUB_ENV"

      - name: Run unit tests
        # The three app variants have a large Android/PDF/OCR classpath. Keep
        # their Kotlin compilation and JVM test workers inside runner memory.
        run: ./gradlew --no-daemon --max-workers=1 test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build and verify side-by-side Beta identity
        run: |
          ./gradlew --no-daemon assembleBeta
          APK=app/build/outputs/apk/beta/app-beta.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.soulphosphor.phosphorshines.beta"
          test "$(apkanalyzer manifest debuggable "$APK")" = "false"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'Phosphor Shines Beta'"

      - name: Compile instrumentation tests
        # Compiles app/src/androidTest (the SQLCipher MemoryStore migration and
        # deletion suite) so build breakage in the tests is caught in CI. The
        # tests themselves require an arm64 device/emulator to RUN
        # (connectedAndroidTest), which the app's arm64-only native code makes
        # impractical on a standard x86_64 CI emulator; compiling them here still
        # guards the suite against bit-rot.
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload side-by-side Beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-beta-apk
          path: app/build/outputs/apk/beta/app-beta.apk
          if-no-files-found: error

      - name: Archive JVM test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-results
          path: app/build/test-results/test*/**/*.xml
          if-no-files-found: error

  recovery-instrumentation:
    name: Recovery instrumentation and fault matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install emulator and build dependencies
        run: |
          set -euo pipefail
          packages=(
            "platform-tools"
            "emulator"
            "system-images;android-35;google_apis;x86_64"
            "ndk;26.3.11579264"
            "cmake;3.22.1"
          )
          # A broken download (for example a truncated emulator zip) fails
          # this step before any test runs. Retry only the download, clearing
          # partial files first. Test steps below are never retried.
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if sdkmanager --install "${packages[@]}"; then
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "SDK package download failed after $attempts attempts." >&2
              exit 1
            fi
            echo "SDK package download failed (attempt $attempt of $attempts); clearing partial files and retrying." >&2
            rm -rf \
              "$ANDROID_HOME/.temp" \
              "$ANDROID_HOME/.downloadIntermediates" \
              "$ANDROID_HOME/emulator" \
              "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
            sleep $((attempt * 15))
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          chmod +x ./gradlew

      - name: Start disposable x86_64 emulator
        run: .github/scripts/emulator-suite.sh start

      - name: Build x86_64 recovery test APKs
        run: >-
          ./gradlew --no-daemon
          -PrecoveryInstrumentationAbi=x86_64
          assembleDebug assembleDebugAndroidTest

      - name: Install recovery test APKs
        run: |
          set -euo pipefail
          test "$(apkanalyzer manifest debuggable app/build/outputs/apk/debug/app-debug.apk)" = "true"
          adb install -t app/build/outputs/apk/debug/app-debug.apk
          adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Prepare q4 Android validation
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/step2-model"
          mkdir -p "$model_dir"
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/5090578d9565bb06545b4552f76e6bc2c93e4a66
          curl --fail --location --retry 3 "$base/onnx/model_q4.onnx" -o "$model_dir/model.onnx"
          curl --fail --location --retry 3 "$base/onnx/model_q4.onnx_data" -o "$model_dir/model_q4.onnx_data"
          curl --fail --location --retry 3 "$base/tokenizer.json" -o "$model_dir/tokenizer.json"
          (cd "$model_dir" && sha256sum --check <<'HASHES'
          ad1dfee81a70f7944b9b9d1cc6e48075b832881cf33fab2f2b248be78f3f0043  model.onnx
          599962c3143b040de2dd05e5975be3e9091dd067cacc6a8f7186e3203bab9e02  model_q4.onnx_data
          4dda02faaf32bc91031dc8c88457ac272b00c1016cc679757d1c441b248b9c47  tokenizer.json
          HASHES
          )
          # Shared external storage can present empty/unreadable files across
          # shell and app UIDs. Stream into app-private storage as the app UID.
          package=com.soulphosphor.phosphorshines
          adb shell run-as "$package" mkdir -p files/step2-model
          for name in model.onnx model_q4.onnx_data tokenizer.json; do
            adb shell -T "run-as $package sh -c 'cat > files/step2-model/$name'" < "$model_dir/$name"
          done
          adb shell "run-as $package sh -c 'cd files/step2-model && sha256sum model.onnx model_q4.onnx_data tokenizer.json'" \
            | tr -d '\r' > "$model_dir/device-hashes.txt"
          (cd "$model_dir" && sha256sum model.onnx model_q4.onnx_data tokenizer.json) \
            > "$model_dir/host-hashes.txt"
          diff -u "$model_dir/host-hashes.txt" "$model_dir/device-hashes.txt"

      - name: Run recovery instrumentation and fault suite
        # Each class runs in its own instrumentation call. The script records
        # every attempt in recovery-results/suite-summary.tsv and the job
        # summary, collects diagnostics on any failure, and recovers a lost
        # emulator at most a bounded number of times (see the script header).
        # Test failures, app crashes and timeouts are never retried.
        run: |
          .github/scripts/emulator-suite.sh run-suite \
            org.teslasoft.assistant.preferences.memory.Step2RecallInstrumentedTest \
            org.teslasoft.assistant.preferences.memory.MemoryLengthInstrumentedTest \
            org.teslasoft.assistant.ui.widgets.MemoryTokenMeterTest \
            org.teslasoft.assistant.ui.util.PromptLibrarySearchInstrumentedTest \
            org.teslasoft.assistant.preferences.backup.PortableRecoveryMatrixInstrumentedTest \
            org.teslasoft.assistant.preferences.backup.DirectDatabaseRestoreInstrumentedTest \
            org.teslasoft.assistant.preferences.memory.MemorySharedRestoreInstrumentedTest \
            org.teslasoft.assistant.preferences.memory.ScannerComparisonCacheInstrumentedTest \
            org.teslasoft.assistant.preferences.memory.ScanFilingInstrumentedTest \
            org.teslasoft.assistant.preferences.memory.PendingPairReviewInstrumentedTest \
            org.teslasoft.assistant.preferences.memory.ScannerReviewEvaluationInstrumentedTest \
            org.teslasoft.assistant.conversation.index.ConversationIndexStoreInstrumentedTest \
            org.teslasoft.assistant.conversation.index.PassageEmbeddingInstrumentedTest \
            org.teslasoft.assistant.conversation.index.ConversationIndexUpkeepInstrumentedTest \
            org.teslasoft.assistant.conversation.index.ConversationIndexSettingsInstrumentedTest \
            org.teslasoft.assistant.conversation.index.ConversationIndexProgressInstrumentedTest \
            org.teslasoft.assistant.ui.conversationindex.ConversationIndexingIconInstrumentedTest \
            org.teslasoft.assistant.service.ConversationIndexingServiceInstrumentedTest \
            org.teslasoft.assistant.service.DataSyncTimeoutInstrumentedTest \
            org.teslasoft.assistant.preferences.backup.companion.CompanionBackupExporterImageValidationInstrumentedTest \
            org.teslasoft.assistant.preferences.generatedimages.GeneratedImageCatalogRecoveryInstrumentedTest \
            org.teslasoft.assistant.preferences.includes.PdfAttachmentStoreInstrumentedTest \
            org.teslasoft.assistant.preferences.includes.PdfFallbackExtractorInstrumentedTest \
            org.teslasoft.assistant.conversation.responsegroups.ResponseGroupStorageInstrumentedTest \
            org.teslasoft.assistant.conversation.parallel.ParallelUsageScreenInstrumentedTest \
            org.teslasoft.assistant.ui.chat.parallel.ParallelResponseUiInstrumentedTest \
            org.teslasoft.assistant.ui.chat.setup.ExperimentalSetupLayoutInstrumentedTest \
            org.teslasoft.assistant.ui.chat.parallel.ParallelPreparationInstrumentedTest \
            org.teslasoft.assistant.ui.chat.parallel.ParallelControllerInstrumentedTest \
            org.teslasoft.assistant.preferences.chatstore.ChatStoreInstrumentedTest \
            org.teslasoft.assistant.preferences.chatstore.ChatStorageFoundationsInstrumentedTest \
            org.teslasoft.assistant.preferences.backup.LargeChatBackupInstrumentedTest

      - name: Collect end-of-job emulator diagnostics
        if: always()
        run: .github/scripts/emulator-suite.sh diagnostics job-end || true

      - name: Record recovery proof metadata
        if: always()
        run: |
          {
            echo "## Phase 12.9 automated recovery matrix"
            echo "- Candidate commit: $GITHUB_SHA"
            echo "- Emulator ABI: $(adb shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r')"
            echo "- Android: $(adb shell getprop ro.build.version.release 2>/dev/null | tr -d '\r')"
            echo "- JVM results: archived by the test job"
            echo "- Instrumentation output: archived by this job"
            echo "- Recovery assertions: logical content, reference closure, integrity, journal cleanup"
          } >> "$GITHUB_STEP_SUMMARY"
          # Measured similarities for the carry-over evaluation set, printed
          # so they can be recorded as a fixture. Measurement only.
          for folder in recall_carryover_set recall_carryover_holdout; do
            similarities="$RUNNER_TEMP/recovery-results/step2-$folder-similarities.json"
            if [ -s "$similarities" ]; then
              echo "ANDROID_SIMILARITIES_BEGIN $folder"
              cat "$similarities"
              echo
              echo "ANDROID_SIMILARITIES_END $folder"
            fi
          done

      - name: Archive instrumentation and fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-instrumentation-results
          path: |
            ${{ runner.temp }}/recovery-results
            ${{ runner.temp }}/recovery-emulator.log
          if-no-files-found: error
