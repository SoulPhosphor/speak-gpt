name: Inspect Stage 2 archived crash
on:
  push:
    branches:
      - diagnostics/parallel-stage2-recovery-proof
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: recovery-instrumentation-results
          repository: SoulPhosphor/speak-gpt
          run-id: 44948531475
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence
      - name: Read existing crash evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("evidence").rglob("ParallelUsageScreenInstrumentedTest-logcat.txt"))
          if len(files) != 1:
              raise SystemExit("Expected one archived logcat: " + repr(files))
          lines = files[0].read_text(errors="replace").splitlines()
          selected = set()
          for index, line in enumerate(lines):
              if any(token in line for token in ("FATAL EXCEPTION", "AndroidRuntime", "am_crash", "ANR in", "Fatal signal")):
                  selected.update(range(max(0, index - 4), min(len(lines), index + 45)))
          if not selected:
              selected.update(range(max(0, len(lines) - 160), len(lines)))
          for index in sorted(selected):
              print(lines[index])
          PY
