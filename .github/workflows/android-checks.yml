name: Android Checks

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correct lifecycle request attribute lookup
        if: github.ref == 'refs/heads/fix/generation-lifecycle-diagnostics'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt")
          text = path.read_text()
          replacements = [
              (
                  "response.call.attributes.contains(responseLifecycleRecorderAttribute)",
                  "response.call.request.attributes.contains(responseLifecycleRecorderAttribute)"
              ),
              (
                  "response.call.attributes[responseLifecycleRecorderAttribute]",
                  "response.call.request.attributes[responseLifecycleRecorderAttribute]"
              ),
              (
                  "val recorder = if (call.attributes.contains(responseLifecycleRecorderAttribute)) {",
                  "val recorder = if (call.request.attributes.contains(responseLifecycleRecorderAttribute)) {"
              ),
              (
                  "call.attributes[responseLifecycleRecorderAttribute]",
                  "call.request.attributes[responseLifecycleRecorderAttribute]"
              ),
          ]
          for old, new in replacements:
              if old in text:
                  assert text.count(old) == 1, f"ambiguous lifecycle attribute anchor: {old}"
                  text = text.replace(old, new, 1)
              else:
                  assert new in text, f"missing lifecycle attribute anchor: {old}"
          path.write_text(text)
          PY

          git diff --check -- app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt
          if ! git diff --quiet -- app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt
            git commit -m "Read lifecycle identity from Ktor request attributes"
            git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26d + CMake 3.22
        run: |
          set -e
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Compile instrumentation tests
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
