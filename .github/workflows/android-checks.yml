name: Android Checks

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Apply staged chat lifecycle repair
        if: ${{ hashFiles('scripts/apply_chat_lifecycle_fix.py') != '' }}
        run: python3 scripts/apply_chat_lifecycle_fix.py

      - name: Keep retained voice bindings application scoped
        if: ${{ hashFiles('scripts/apply_chat_lifecycle_context_fix.py') != '' }}
        run: python3 scripts/apply_chat_lifecycle_context_fix.py

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26d + CMake 3.22
        run: |
          set -e
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Compile instrumentation tests
        # Compiles app/src/androidTest (the SQLCipher MemoryStore migration and
        # deletion suite) so build breakage in the tests is caught in CI. The
        # tests themselves require an arm64 device/emulator to RUN
        # (connectedAndroidTest), which the app's arm64-only native code makes
        # impractical on a standard x86_64 CI emulator; compiling them here still
        # guards the suite against bit-rot.
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit tested lifecycle repair to PR branch
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt \
                  app/src/main/java/org/teslasoft/assistant/service/HandsFreeActivityLifetimePolicy.kt \
                  app/src/test/java/org/teslasoft/assistant/service/HandsFreeActivityLifetimePolicyTest.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Keep hands-free alive across chat screen destruction"
            git push origin HEAD:${{ github.head_ref }}
          fi
