name: Android Checks

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply lifecycle request identity patch
        if: github.ref == 'refs/heads/fix/generation-lifecycle-diagnostics'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt")
          text = path.read_text()
          original = text

          # 1. Bind the recorder to the exact outgoing streamed generation request.
          function_needle = "    private fun augmentRequestWithProviderRouting(request: HttpRequestBuilder) {"
          if "private fun bindLifecycleRecorderToGenerationRequest" not in text:
              assert text.count(function_needle) == 1, "augment function anchor changed"
              helper = '''    /**
               * Bind lifecycle diagnostics to the exact Ktor request BEFORE dispatch.
               * Auxiliary non-stream requests share this client, so request identity is
               * attached only to streamed chat/legacy-completion bodies.
               */
              private fun bindLifecycleRecorderToGenerationRequest(request: HttpRequestBuilder) {
                  if (request.attributes.contains(responseLifecycleRecorderAttribute)) return
                  val recorder = currentLifecycle ?: return
                  if (recorder.finalized) return
                  val content = request.body as? TextContent ?: return
                  if (content.contentType?.match(ContentType.Application.Json) != true) return

                  val isStreamedGeneration = try {
                      val root = com.google.gson.JsonParser.parseString(content.text).asJsonObject
                      val streamed = root.get("stream")
                          ?.takeUnless { it.isJsonNull }
                          ?.asBoolean == true
                      val hasGenerationInput = root.has("messages") || root.has("prompt")
                      streamed && root.has("model") && hasGenerationInput
                  } catch (_: Exception) {
                      false
                  }
                  if (isStreamedGeneration) {
                      request.attributes.put(responseLifecycleRecorderAttribute, recorder)
                  }
              }

          '''
              text = text.replace(function_needle, helper + function_needle, 1)

          old_metadata_gate = '''        if (currentLifecycle != null) {
                      // Official OpenRouter audit metadata'''
          new_metadata_gate = '''        if (request.attributes.contains(responseLifecycleRecorderAttribute)) {
                      // Official OpenRouter audit metadata'''
          if old_metadata_gate in text:
              assert text.count(old_metadata_gate) == 1, "OpenRouter metadata gate is ambiguous"
              text = text.replace(old_metadata_gate, new_metadata_gate, 1)
          else:
              assert new_metadata_gate in text, "OpenRouter metadata gate changed"

          # 2. A successful response may observe only the recorder already carried by
          #    that call. Never consult mutable currentLifecycle to infer provenance.
          old_observer = '''                                val recorder = currentLifecycle
                                          if (recorder == null) {
                                              false
                                          } else {
                                              recorder.beginProviderObservation()
                                              if (!call.attributes.contains(responseLifecycleRecorderAttribute)) {
                                                  call.attributes.put(responseLifecycleRecorderAttribute, recorder)
                                              }
                                              true
                                          }'''
          new_observer = '''                                val recorder = if (call.attributes.contains(responseLifecycleRecorderAttribute)) {
                                              call.attributes[responseLifecycleRecorderAttribute]
                                          } else {
                                              null
                                          }
                                          if (recorder == null || recorder.finalized) {
                                              false
                                          } else {
                                              recorder.beginProviderObservation()
                                              true
                                          }'''
          if old_observer in text:
              assert text.count(old_observer) == 1, "response observer ownership block is ambiguous"
              text = text.replace(old_observer, new_observer, 1)
          else:
              assert new_observer in text, "response observer ownership block changed"

          # 3. The Send hook is the pre-dispatch identity boundary.
          old_send = '''                        on(Send) { request ->
                                      try {
                                          augmentRequestWithProviderRouting(request)'''
          new_send = '''                        on(Send) { request ->
                                      bindLifecycleRecorderToGenerationRequest(request)
                                      try {
                                          augmentRequestWithProviderRouting(request)'''
          if old_send in text:
              assert text.count(old_send) == 1, "Send hook anchor is ambiguous"
              text = text.replace(old_send, new_send, 1)
          else:
              assert new_send in text, "Send hook anchor changed"

          # 4. Formatting consumes only this recorder's attempt slot.
          old_format = '''            generationId = r.generationId, errorText = errorText
                  ) + providerRoutingLogLine(r.model)'''
          new_format = '''            generationId = r.generationId, errorText = errorText,
                      attemptId = r.attemptId
                  ) + providerRoutingLogLine(r.model)'''
          if old_format in text:
              assert text.count(old_format) == 1, "lifecycle format anchor is ambiguous"
              text = text.replace(old_format, new_format, 1)
          else:
              assert new_format in text, "lifecycle format anchor changed"

          if text != original:
              path.write_text(text)
          PY

          if git diff --quiet -- app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt; then
            echo "Lifecycle request binding already applied."
          else
            git diff --check -- app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt
            git commit -m "Bind lifecycle evidence to exact HTTP attempts"
            git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26d + CMake 3.22
        run: |
          set -e
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Compile instrumentation tests
        # Compiles app/src/androidTest (the SQLCipher MemoryStore migration and
        # deletion suite) so build breakage in the tests is caught in CI. The
        # tests themselves require an arm64 device/emulator to RUN
        # (connectedAndroidTest), which the app's arm64-only native code makes
        # impractical on a standard x86_64 CI emulator; compiling them here still
        # guards the suite against bit-rot.
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
