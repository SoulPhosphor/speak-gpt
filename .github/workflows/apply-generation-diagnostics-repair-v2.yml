              '            wifiLockHeld = try { wifiLock?.isHeld == true } catch (_: Throwable) { false },\n'
              '            wifiLockFailure = lastWifiLockFailure\n'
              '        )\n'
              '    }\n\n'
              '    private fun logWakeLockEvent(level: String, message: String) {\n',
              'hands-free snapshot')
          sub_once(HF,
              r'    @Suppress\("DEPRECATION"\)\n    private fun acquireWifiLock\(\) \{.*?^    \}\n\n    private fun releaseLocks',
              '''    @Suppress("DEPRECATION")
          private fun acquireWifiLock() {
              if (wifiLock?.isHeld == true) {
                  lastWifiLockFailure = null
                  return
              }
              try {
                  val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, WAKE_LOCK_TAG).apply {
                      setReferenceCounted(false)
                      acquire()
                  }
                  lastWifiLockFailure = null
              } catch (t: Throwable) {
                  val detail = "${t.javaClass.simpleName}: ${t.message}"
                  lastWifiLockFailure = detail
                  try {
                      Logger.log(applicationContext, "event", "HandsFreeService", "warning",
                          "Wi-Fi lock acquisition failed: $detail")
                  } catch (_: Throwable) { /* diagnostics must never disturb hands-free */ }
              }
          }

          private fun releaseLocks''',
              'hands-free Wi-Fi block')
          with HF.open('a') as f:
              f.write('''

          /** Actual hands-free keep-alive state sampled at generation failure time. */
          data class HandsFreeConnectionDiagnostics(
              val serviceRunning: Boolean,
              val serviceAgeMs: Long,
              val wakeLockHeld: Boolean,
              val wifiLockHeld: Boolean,
              val wifiLockFailure: String?
          ) {
              fun asLogFields(): String =
                  "serviceRunning=$serviceRunning serviceAge=${serviceAgeMs}ms " +
                      "wakeLockHeld=$wakeLockHeld wifiLockHeld=$wifiLockHeld " +
                      "wifiLockFailure=${wifiLockFailure ?: "none"}"
          }
          ''')

          # Android callback wrapper + pure transition trace for JVM tests.
          Path('app/src/main/java/org/teslasoft/assistant/util/GenerationNetworkDiagnostics.kt').write_text('''/**************************************************************************
           * Copyright (c) 2023-2026 Dmytro Ostapenko. All rights reserved.
           * Licensed under the Apache License, Version 2.0.
           **************************************************************************/

          package org.teslasoft.assistant.util

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.os.SystemClock
          import org.teslasoft.assistant.service.GenerationKeepAliveDiagnostics
          import org.teslasoft.assistant.service.HandsFreeConnectionDiagnostics

          data class NetworkTransition(val from: String, val to: String, val elapsedMs: Long)

          data class GenerationNetworkSnapshot(
              val atDispatch: String,
              val atFailure: String,
              val transitions: List<NetworkTransition>
          ) {
              fun transitionsDisplay(): String = if (transitions.isEmpty()) "none observed" else
                  transitions.joinToString(" | ") { "${it.from} -> ${it.to} at +${it.elapsedMs} ms" }
          }

          internal class NetworkTransitionTrace(val initial: String, private val startedAtMs: Long) {
              private var current = initial
              private val changes = ArrayList<NetworkTransition>()

              fun record(state: String, nowMs: Long) {
                  if (state == current || state == "unknown") return
                  changes += NetworkTransition(current, state, (nowMs - startedAtMs).coerceAtLeast(0L))
                  current = state
              }

              fun snapshot(finalState: String) = GenerationNetworkSnapshot(initial, finalState, changes.toList())
          }

          class GenerationNetworkMonitor(context: Context) : AutoCloseable {
              private val cm = context.applicationContext.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
              private val startedAtMs = SystemClock.elapsedRealtime()
              private val lock = Any()
              private val trace = NetworkTransitionTrace(currentTransport(), startedAtMs)
              @Volatile private var registered = false

              private val callback = object : ConnectivityManager.NetworkCallback() {
                  override fun onAvailable(network: Network) = record(stateFor(network))
                  override fun onCapabilitiesChanged(network: Network, caps: NetworkCapabilities) = record(stateFor(caps))
                  override fun onLost(network: Network) = record(currentTransport())
              }

              init {
                  try {
                      cm.registerDefaultNetworkCallback(callback)
                      registered = true
                  } catch (_: Throwable) {}
              }

              fun snapshot(): GenerationNetworkSnapshot {
                  val finalState = currentTransport()
                  synchronized(lock) {
                      trace.record(finalState, SystemClock.elapsedRealtime())
                      return trace.snapshot(finalState)
                  }
              }

              private fun record(state: String) = synchronized(lock) {
                  trace.record(state, SystemClock.elapsedRealtime())
              }

              private fun currentTransport(): String = try {
                  val network = cm.activeNetwork ?: return "none"
                  stateFor(network)
              } catch (_: Throwable) { "unknown" }

              private fun stateFor(network: Network): String = try {
                  stateFor(cm.getNetworkCapabilities(network) ?: return "unknown")
              } catch (_: Throwable) { "unknown" }

              private fun stateFor(caps: NetworkCapabilities): String = when {
                  caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> "wifi"
                  caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) -> "cellular"
                  caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET) -> "ethernet"
                  caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN) -> "vpn"
                  else -> "other"
              }

              override fun close() {
                  if (!registered) return
                  registered = false
                  try { cm.unregisterNetworkCallback(callback) } catch (_: Throwable) {}
              }
          }

          data class GenerationFailureSnapshot(
              val voiceLive: Boolean,
              val network: GenerationNetworkSnapshot,
              val generationKeepAlive: GenerationKeepAliveDiagnostics,
              val handsFreeKeepAlive: HandsFreeConnectionDiagnostics
          ) {
              fun asLogLines(): List<String> = listOf(
                  "Network at dispatch: ${network.atDispatch}",
                  "Network at failure: ${network.atFailure}",
                  "Network transitions: ${network.transitionsDisplay()}",
                  "Generation keep-alive: ${generationKeepAlive.asLogFields()}",
                  "Hands-free keep-alive: ${handsFreeKeepAlive.asLogFields()}"
              )
          }

          internal fun resolveFailureVoiceState(captured: GenerationFailureSnapshot?, currentVoiceLive: Boolean): Boolean =
              captured?.voiceLive ?: currentVoiceLive
          ''')

          Path('app/src/test/java/org/teslasoft/assistant/util/GenerationNetworkDiagnosticsTest.kt').write_text('''package org.teslasoft.assistant.util

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.teslasoft.assistant.service.GenerationKeepAliveDiagnostics
          import org.teslasoft.assistant.service.HandsFreeConnectionDiagnostics

          class GenerationNetworkDiagnosticsTest {
              @Test fun traceRecordsOnlyRealTransportChanges() {
                  val trace = NetworkTransitionTrace("wifi", 1000L)
                  trace.record("wifi", 1200L)
                  trace.record("cellular", 96842L)
                  trace.record("cellular", 97000L)
                  val snapshot = trace.snapshot("cellular")
                  assertEquals("wifi", snapshot.atDispatch)
                  assertEquals("cellular", snapshot.atFailure)
                  assertEquals(1, snapshot.transitions.size)
                  assertEquals(95842L, snapshot.transitions.single().elapsedMs)
                  assertEquals("wifi -> cellular at +95842 ms", snapshot.transitionsDisplay())
              }

              @Test fun noTransitionIsExplicit() {
                  assertEquals("none observed", NetworkTransitionTrace("wifi", 0L).snapshot("wifi").transitionsDisplay())
              }

              @Test fun capturedVoiceStateWinsAfterTeardown() {
                  val captured = GenerationFailureSnapshot(
                      true,
                      GenerationNetworkSnapshot("wifi", "cellular", emptyList()),
                      GenerationKeepAliveDiagnostics(true, 1, 100L, true, true, null),
                      HandsFreeConnectionDiagnostics(true, 1000L, true, true, null)
                  )
                  assertTrue(resolveFailureVoiceState(captured, false))
                  assertFalse(resolveFailureVoiceState(null, false))
              }
          }
          ''')

          Path('app/src/test/java/org/teslasoft/assistant/preferences/ResponseLifecycleFinishReasonProvenanceTest.kt').write_text('''package org.teslasoft.assistant.preferences

          import org.junit.Assert.assertTrue
          import org.junit.Test

          class ResponseLifecycleFinishReasonProvenanceTest {
              @Test fun networkFailureWithoutProviderFinishReasonReportsMissing() {
                  val body = format("missing", ResponseLifecycle.Termination.NETWORK_ERROR,
                      "SocketException: Software caused connection abort")
                  assertTrue(body.contains("Finish Reason: missing"))
                  assertTrue(body.contains("Finish Reason Received: false"))
              }

              @Test fun typedProviderErrorFinishReasonIsStillReceived() {
                  val body = format("error", ResponseLifecycle.Termination.PROVIDER_ERROR, "provider stream terminated")
                  assertTrue(body.contains("Finish Reason: error"))
                  assertTrue(body.contains("Finish Reason Received: true"))
              }

              @Test fun rawProviderErrorWithoutFinishReasonDoesNotInventOne() {
                  val recorder = recorder("T-no-finish")
                  recorder.beginProviderObservation()
                  recorder.noteActualModelProvider(RawStreamObservationCodec.encode(RawStreamObservation(
                      sseDataEvents = 2, providerErrorReceived = true,
