              '                    serviceAgeMs = 0L,\n'
              '                    wakeLockHeld = false,\n'
              '                    wifiLockHeld = false,\n'
              '                    wifiLockFailure = lastWifiLockFailure\n'
              '                )\n',
              'hands-free connection accessor')
          once(HF,
              '    private fun logWakeLockEvent(level: String, message: String) {\n',
              '    private fun snapshotConnectionDiagnostics(): HandsFreeConnectionDiagnostics {\n'
              '        val wake = snapshotWakeLockDiagnostics()\n'
              '        return HandsFreeConnectionDiagnostics(\n'
              '            serviceRunning = wake.serviceRunning,\n'
              '            serviceAgeMs = wake.serviceAgeMs,\n'
