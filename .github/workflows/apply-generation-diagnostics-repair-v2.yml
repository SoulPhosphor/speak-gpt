          once(CHAT,
              '        logVoiceFailureSnapshot(result.code.code)\n',
              '        logVoiceFailureSnapshot(result.code.code, voiceLive)\n',
              'voice snapshot call')
          once(CHAT,
              '    private fun logVoiceFailureSnapshot(code: String) {\n'
              '        if (!isVoiceLive()) return\n',
              '    private fun logVoiceFailureSnapshot(code: String, voiceWasLive: Boolean = isVoiceLive()) {\n'
              '        if (!voiceWasLive) return\n',
              'voice snapshot guard')
          once(CHAT,
              '        } finally {\n'
              '            GenerationForegroundService.end(this)\n',
              '        } finally {\n'
              '            try { generationNetworkMonitor?.close() } catch (_: Throwable) {}\n'
              '            generationNetworkMonitor = null\n'
              '            GenerationForegroundService.end(this)\n',
              'network monitor cleanup')

          # ResponseLifecycle: distinguish provider finish evidence from local outcome labels.
          once(LIFE,
              '        val effectiveFinish = when {\n'
              '            suppliedFinish.equals("missing", ignoreCase = true) && observedFinish != null -> observedFinish\n'
              '            suppliedFinish.equals("error", ignoreCase = true) && observedFinish != null -> observedFinish\n'
              '            else -> suppliedFinish\n'
              '        }\n',
              '        val effectiveFinish = when {\n'
              '            suppliedFinish.equals("missing", ignoreCase = true) && observedFinish != null -> observedFinish\n'
              '            suppliedFinish.equals("error", ignoreCase = true) && observedFinish != null -> observedFinish\n'
              '            else -> suppliedFinish\n'
              '        }\n'
              '        val finishReasonReceived = observedFinish != null ||\n'
              '            !suppliedFinish.equals("missing", ignoreCase = true)\n',
