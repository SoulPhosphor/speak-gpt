              '        /** Service + CPU/Wi-Fi protection sampled before hands-free teardown. */\n'
              '        fun connectionDiagnostics(): HandsFreeConnectionDiagnostics =\n'
              '            activeService?.snapshotConnectionDiagnostics()\n'
              '                ?: HandsFreeConnectionDiagnostics(\n'
