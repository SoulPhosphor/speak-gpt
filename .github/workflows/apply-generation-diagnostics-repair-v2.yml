name: Apply Generation Diagnostics Repair V2

on:
  push:
    branches:
      - agent/generation-diagnostics-repair

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generation-diagnostics-repair

      - name: Apply targeted repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          CHAT = Path('app/src/main/java/org/teslasoft/assistant/ui/activities/ChatActivity.kt')
          LIFE = Path('app/src/main/java/org/teslasoft/assistant/preferences/ResponseLifecycle.kt')
          GEN = Path('app/src/main/java/org/teslasoft/assistant/service/GenerationForegroundService.kt')
          HF = Path('app/src/main/java/org/teslasoft/assistant/service/HandsFreeService.kt')

          def once(path, old, new, label):
              text = path.read_text()
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {n}')
              path.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, label):
              text = path.read_text()
              out, n = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S | re.M)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {n}')
              path.write_text(out)

          # ChatActivity: one monitor per actual provider stream collection.
          once(CHAT,
              '    private var currentLifecycle: ResponseLifecycleRecorder? = null\n',
              '    private var currentLifecycle: ResponseLifecycleRecorder? = null\n\n'
              '    /** Network transport evidence for the currently dispatched provider request. */\n'
              '    private var generationNetworkMonitor: org.teslasoft.assistant.util.GenerationNetworkMonitor? = null\n',
              'network monitor field')

          text = CHAT.read_text()
          marker = '        providerRequestDispatched = true\n'
          if text.count(marker) != 3:
              raise RuntimeError(f'dispatch points: expected 3, found {text.count(marker)}')
          CHAT.write_text(text.replace(marker, '        startGenerationNetworkDiagnostics()\n' + marker))

          once(CHAT,
              '        } catch (e: Exception) {\n'
              '            playErrorSignal()\n'
              '            stopHandsFreeOnError()\n'
              '            // Single funnel: classify the failure to a stable code, always write\n',
              '        } catch (e: Exception) {\n'
              '            playErrorSignal()\n'
              '            val failureDiagnostics = captureGenerationFailureDiagnostics()\n'
              '            stopHandsFreeOnError()\n'
              '            // Single funnel: classify the failure to a stable code, always write\n',
              'pre-teardown snapshot')
          once(CHAT,
              '            logGenerationError(genError, e, "message")\n',
              '            logGenerationError(genError, e, "message", failureDiagnostics)\n',
              'message snapshot handoff')

          # A local exception is not itself a provider finish_reason.
          once(CHAT,
              '                            finalizeLifecycleTerminal(\n'
              '                                ResponseLifecycle.Outcome.INCOMPLETE, "error", true,\n'
              '                                ResponseLifecycle.Termination.PROVIDER_ERROR, toolsError.message\n'
              '                            )\n',
              '                            finalizeLifecycleTerminal(\n'
              '                                ResponseLifecycle.Outcome.INCOMPLETE, "missing", true,\n'
              '                                ResponseLifecycle.Termination.PROVIDER_ERROR, toolsError.message\n'
              '                            )\n',
              'tools rejection finish provenance')
          once(CHAT,
              '            finalizeLifecycleTerminal(\n'
              '                ResponseLifecycle.Outcome.INCOMPLETE, "error", true,\n'
              '                lifecycleTermination, lifecycleError\n'
              '            )\n',
              '            finalizeLifecycleTerminal(\n'
              '                ResponseLifecycle.Outcome.INCOMPLETE,\n'
              '                currentLifecycle?.lastFinishReason ?: "missing",\n'
              '                true,\n'
              '                lifecycleTermination, lifecycleError\n'
              '            )\n',
