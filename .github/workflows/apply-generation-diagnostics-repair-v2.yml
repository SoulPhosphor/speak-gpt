          # Hands-free service: expose Wi-Fi lock state and failure, not just CPU wake state.
          once(HF,
              '        private var activeService: HandsFreeService? = null\n',
              '        private var activeService: HandsFreeService? = null\n\n'
              '        @Volatile private var lastWifiLockFailure: String? = null\n',
              'hands-free failure field')
          once(HF,
              '        fun wakeLockDiagnostics(): HandsFreeWakeLockDiagnostics =\n'
              '            activeService?.snapshotWakeLockDiagnostics()\n'
              '                ?: HandsFreeWakeLockDiagnostics(\n'
              '                    serviceRunning = false,\n'
              '                    serviceAgeMs = 0L,\n'
              '                    wakeLockHeld = false,\n'
