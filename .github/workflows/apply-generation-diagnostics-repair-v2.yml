              '                )\n',
              '        fun wakeLockDiagnostics(): HandsFreeWakeLockDiagnostics =\n'
              '            activeService?.snapshotWakeLockDiagnostics()\n'
              '                ?: HandsFreeWakeLockDiagnostics(\n'
              '                    serviceRunning = false,\n'
