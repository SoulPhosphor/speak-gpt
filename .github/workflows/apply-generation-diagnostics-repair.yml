          class ResponseLifecycleFinishReasonProvenanceTest {
              @Test fun networkFailureWithoutProviderFinishReasonReportsMissing() {
                  val body = format(
                      finishReason = "missing",
                      termination = ResponseLifecycle.Termination.NETWORK_ERROR,
                      error = "SocketException: Software caused connection abort"
                  )
                  assertTrue(body.contains("Finish Reason: missing"))
                  assertTrue(body.contains("Finish Reason Received: false"))
              }

              @Test fun typedProviderErrorFinishReasonIsStillReportedAsReceived() {
                  val body = format(
                      finishReason = "error",
                      termination = ResponseLifecycle.Termination.PROVIDER_ERROR,
                      error = "provider stream terminated"
                  )
                  assertTrue(body.contains("Finish Reason: error"))
                  assertTrue(body.contains("Finish Reason Received: true"))
              }

              @Test fun rawProviderErrorWithoutFinishReasonDoesNotInventOne() {
                  val recorder = recorder("T-provider-error-no-finish")
                  recorder.beginProviderObservation()
                  recorder.noteActualModelProvider(
                      RawStreamObservationCodec.encode(
                          RawStreamObservation(
                              sseDataEvents = 2,
