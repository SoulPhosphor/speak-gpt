name: Side-by-side Beta APK

on:
  push:
    branches:
      - agent/phase-8-pre-main-safety

concurrency:
  group: side-by-side-beta
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          chmod +x ./gradlew

      - name: Test and build Beta
        run: ./gradlew --no-daemon test assembleBeta

      - name: Assert Beta identity and label
        run: |
          APK=app/build/outputs/apk/beta/app-beta.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.soulphosphor.phosphorshines.beta"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'Phosphor Shines Beta'"
          cp "$APK" phosphor-shines-beta.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-8-beta-candidate
          path: phosphor-shines-beta.apk
          if-no-files-found: error

      - name: Write Beta instructions
        run: |
          cat > beta-notes.md <<'NOTES'
          ## Phosphor Shines Beta

          This Beta installs beside the working pre-release. Its Android package is
          `com.soulphosphor.phosphorshines.beta`; it does not replace the working copy.

          1. Download **phosphor-shines-beta.apk**.
          2. Tap the file and allow installation from this source if Android asks.
          3. Launch **Phosphor Shines Beta** from its separate app entry.
          4. To remove it, uninstall **Phosphor Shines Beta** only. Do not uninstall the working pre-release.

          The Beta has its own private chats, preferences, databases, keys, scheduled work,
          and app-specific files. It cannot read the working pre-release's private data.
          NOTES

      - name: Replace only the Beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create beta-latest phosphor-shines-beta.apk \
            --target "$GITHUB_SHA" \
            --title "Phosphor Shines Beta" \
            --notes-file beta-notes.md \
            --prerelease
