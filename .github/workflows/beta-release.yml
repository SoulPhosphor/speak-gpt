name: Side-by-side Beta APK

on:
  push:
    branches:
      - main

concurrency:
  group: side-by-side-beta
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build dependencies
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          chmod +x ./gradlew

      # Robolectric downloads its Android framework jars from Maven Central
      # while the unit tests run, outside the Gradle cache. Keeping them
      # avoids repeat downloads that Maven Central has rate-limited (HTTP 429).
      - name: Cache Robolectric framework jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Download pinned EmbeddingGemma tokenizer for JVM tests
        # Real-tokenizer unit tests (PassageSearchTextGemmaTest,
        # PassageEmbeddingGemmaTest, ScannerQueryWindowsGemmaTest) read it
        # through GEMMA_TOKENIZER_JSON and fail on CI when it is missing.
        run: |
          set -euo pipefail
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/5090578d9565bb06545b4552f76e6bc2c93e4a66
          curl --fail --location --retry 3 "$base/tokenizer.json" -o "$RUNNER_TEMP/tokenizer.json"
          echo "4dda02faaf32bc91031dc8c88457ac272b00c1016cc679757d1c441b248b9c47  $RUNNER_TEMP/tokenizer.json" | sha256sum --check
          echo "GEMMA_TOKENIZER_JSON=$RUNNER_TEMP/tokenizer.json" >> "$GITHUB_ENV"

      - name: Run unit tests
        # Keep variant compilation and test workers within runner memory.
        run: ./gradlew --no-daemon --max-workers=1 test

      - name: Build Beta
        run: ./gradlew --no-daemon --max-workers=1 assembleBeta

      - name: Assert Beta identity and label
        run: |
          APK=app/build/outputs/apk/beta/app-beta.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.soulphosphor.phosphorshines.beta"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'Phosphor Shines Beta'"
          cp "$APK" phosphor-shines-beta.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-8-beta-candidate
          path: phosphor-shines-beta.apk
          if-no-files-found: error

      - name: Write Beta instructions
        run: |
          cat > beta-notes.md <<'NOTES'
          ## Phosphor Shines Beta

          This Beta installs beside the working pre-release. Its Android package is
          `com.soulphosphor.phosphorshines.beta`; it does not replace the working copy.

          1. Download **phosphor-shines-beta.apk**.
          2. Tap the file and allow installation from this source if Android asks.
          3. Launch **Phosphor Shines Beta** from its separate app entry.
          4. To remove it, uninstall **Phosphor Shines Beta** only. Do not uninstall the working pre-release.

          The Beta has its own private chats, preferences, databases, keys, scheduled work,
          and app-specific files. It cannot read the working pre-release's private data.
          NOTES

      - name: Replace only the Beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create beta-latest phosphor-shines-beta.apk \
            --target "$GITHUB_SHA" \
            --title "Phosphor Shines Beta" \
            --notes-file beta-notes.md \
            --prerelease
